# CI: lint + автотесты. Автогенерируемые бандлы не хранятся в git —
# собираются из исходников внутри job (префикс build:bundles в npm test).
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Tests (with bundle rebuild)
        run: npm test
